name: Build Android APK (Godot 4)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  export-android:
    name: Export APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Android SDK, Java & Export Templates
        run: |
          set -e
          mkdir -p ~/.android /github/home/.local/share/godot/export_templates/4.2.2.stable build/android

          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi

          curl -sSL -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* /github/home/.local/share/godot/export_templates/4.2.2.stable/

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/android-sdk}}"
          mkdir -p "$SDK_ROOT"
          yes | sdkmanager --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          sdkmanager --sdk_root="$SDK_ROOT" "platforms;android-33" "build-tools;33.0.2" >/dev/null

          JAVA_BIN="$(dirname "$(readlink -f "$(which java)")")"
          JAVA_HOME_DIR="$(dirname "$JAVA_BIN")"

          mkdir -p /github/home/.config/godot
          cat > /github/home/.config/godot/editor_settings-4.editor_settings <<EOF
          [gd_editor_settings]
          export/android/android_sdk_path = "$SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME_DIR"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Export Debug APK
        run: |
          godot --headless --verbose --export-debug "Android" build/android/RimWorldColony.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RimWorldColony-Android-APK
          path: build/android/RimWorldColony.apk
