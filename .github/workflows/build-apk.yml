name: Build Android APK (Godot 4)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  export-android:
    name: Export APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Android SDK, Java & Export Templates
        run: |
          set -e
          HOME_DIR="/github/home"
          SDK_DIR="/usr/local/android-sdk"
          TPL_DIR="$HOME_DIR/.local/share/godot/export_templates/4.2.2.stable"
          KEYSTORE_PATH="$HOME_DIR/.android/debug.keystore"

          mkdir -p "$HOME_DIR/.android" "$TPL_DIR" "$SDK_DIR" build/android

          if [ ! -f "$KEYSTORE_PATH" ]; then
            keytool -genkeypair -v -keystore "$KEYSTORE_PATH" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "$TPL_DIR/android_debug.apk" ]; then
            URL="https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz"
            if command -v wget >/dev/null 2>&1; then
              wget -q -O /tmp/templates.tpz "$URL"
            else
              python3 -c "import urllib.request; urllib.request.urlretrieve('$URL', '/tmp/templates.tpz')"
            fi
            unzip -q /tmp/templates.tpz -d /tmp/templates
            mv /tmp/templates/templates/* "$TPL_DIR/"
          fi

          yes | sdkmanager --sdk_root="$SDK_DIR" --licenses >/dev/null || true
          sdkmanager --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-33" "build-tools;33.0.2" >/dev/null

          JAVA_BIN_PATH="$(readlink -f "$(which java)")"
          JAVA_DIR="$(dirname "$(dirname "$JAVA_BIN_PATH")")"

          python3 - <<PY
import pathlib, re

ks = "$KEYSTORE_PATH"
sdk = "$SDK_DIR"
jdk = "$JAVA_DIR"

for cfg_path in [pathlib.Path("export_presets.cfg")]:
    if cfg_path.exists():
        txt = cfg_path.read_text(encoding="utf-8")
        replacements = {
            "keystore/debug=": f'keystore/debug="{ks}"',
            "keystore/debug_user=": 'keystore/debug_user="androiddebugkey"',
            "keystore/debug_password=": 'keystore/debug_password="android"',
        }
        for key, val in replacements.items():
            if re.search(rf"^{re.escape(key)}.*$", txt, flags=re.M):
                txt = re.sub(rf"^{re.escape(key)}.*$", val, txt, flags=re.M)
            else:
                txt += f"\n{val}\n"
        cfg_path.write_text(txt, encoding="utf-8")

godot_cfg = pathlib.Path("$HOME_DIR/.config/godot")
godot_cfg.mkdir(parents=True, exist_ok=True)
settings_txt = f'''[gd_editor_settings]

export/android/android_sdk_path = "{sdk}"
export/android/java_sdk_path = "{jdk}"
export/android/debug_keystore = "{ks}"
export/android/debug_keystore_user = "androiddebugkey"
export/android/debug_keystore_pass = "android"
'''
for fname in ["editor_settings-4.editor_settings", "editor_settings-4.tres"]:
    (godot_cfg / fname).write_text(settings_txt, encoding="utf-8")
PY

      - name: Export Debug APK
        run: |
          godot --headless --verbose --export-debug "Android" build/android/RimWorldColony.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RimWorldColony-Android-APK
          path: build/android/RimWorldColony.apk
