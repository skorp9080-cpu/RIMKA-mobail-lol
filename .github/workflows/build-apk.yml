name: Build Android APK (Godot 4)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  export-android:
    name: Export APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Android SDK, Java & Export Templates
        run: |
          set -e
          SDK_DIR="/usr/local/android-sdk"
          KEYSTORE_PATH="/root/.android/debug.keystore"
          TPL_ROOT="/root/.local/share/godot/export_templates/4.2.2.stable"
          TPL_ALT="/github/home/.local/share/godot/export_templates/4.2.2.stable"

          mkdir -p /root/.android /github/home/.android "$SDK_DIR" /root/.config/godot /github/home/.config/godot "$TPL_ROOT" "$TPL_ALT" build/android

          if [ ! -f "$KEYSTORE_PATH" ]; then
            keytool -genkeypair -v -keystore "$KEYSTORE_PATH" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi
          cp "$KEYSTORE_PATH" /github/home/.android/debug.keystore

          if [ ! -f "$TPL_ROOT/android_debug.apk" ]; then
            URL="https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz"
            wget -q -O /tmp/templates.tpz "$URL"
            unzip -q /tmp/templates.tpz -d /tmp/templates
            cp -r /tmp/templates/templates/* "$TPL_ROOT/"
          fi
          cp -r "$TPL_ROOT"/* "$TPL_ALT/"

          yes | sdkmanager --sdk_root="$SDK_DIR" --licenses >/dev/null || true
          sdkmanager --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-33" "build-tools;33.0.2" "platforms;android-34" "build-tools;34.0.0" >/dev/null

          JAVA_BIN_PATH="$(readlink -f "$(which java)")"
          JAVA_DIR="$(dirname "$(dirname "$JAVA_BIN_PATH")")"

          printf '[gd_editor_settings]\n\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\nexport/android/debug_keystore = "%s"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\n' "$SDK_DIR" "$JAVA_DIR" "$KEYSTORE_PATH" > /root/.config/godot/editor_settings-4.tres
          cp /root/.config/godot/editor_settings-4.tres /root/.config/godot/editor_settings-4.editor_settings
          cp /root/.config/godot/editor_settings-4.tres /github/home/.config/godot/editor_settings-4.tres
          cp /root/.config/godot/editor_settings-4.tres /github/home/.config/godot/editor_settings-4.editor_settings

          cat <<EOF > export_presets.cfg
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/android/RimWorldColony.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/export_format=0
          gradle_build/min_sdk=""
          gradle_build/target_sdk=""
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name="1.0"
          package/unique_name="com.denys.rimworldcolony"
          package/name="RimWorld Colony"
          package/signed=true
          keystore/debug="$KEYSTORE_PATH"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          keystore/release=""
          keystore/release_user=""
          keystore/release_password=""
          screen/immersive_mode=true
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true
          EOF

          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_DIR" >> "$GITHUB_ENV"

      - name: Export Debug APK
        run: |
          mkdir -p build/android
          ls -la /root/.android/debug.keystore /root/.local/share/godot/export_templates/4.2.2.stable/android_debug.apk
          grep -n "keystore/debug=" export_presets.cfg || true
          godot --headless --verbose --export-debug "Android" build/android/RimWorldColony.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RimWorldColony-Android-APK
          path: build/android/RimWorldColony.apk
          
