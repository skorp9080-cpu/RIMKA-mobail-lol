name: Build Android APK (Godot 4)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/android-sdk
  ANDROID_SDK_ROOT: /usr/local/android-sdk

jobs:
  export-android:
    name: Export APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize project.godot
        run: |
          set -e
          awk '
          BEGIN {
            section = ""
            seen_stretch_mode = 0
            has_mouse_from_touch = 0
            has_etc2_astc = 0
            has_input_sec = 0
            has_render_sec = 0
          }
          function flush_section(sec) {
            if (sec == "display" && !seen_stretch_mode) {
              print "window/stretch/mode=\"canvas_items\""
              seen_stretch_mode = 1
            } else if (sec == "input_devices" && !has_mouse_from_touch) {
              print "pointing/emulate_mouse_from_touch=true"
              has_mouse_from_touch = 1
            } else if (sec == "rendering" && !has_etc2_astc) {
              print "textures/vram_compression/import_etc2_astc=true"
              has_etc2_astc = 1
            }
          }
          {
            sub(/\r$/, "")
            line = $0
            trimmed = line
            gsub(/^[ \t]+|[ \t]+$/, "", trimmed)

            if (trimmed ~ /^\[.*\]$/) {
              flush_section(section)
              section = substr(trimmed, 2, length(trimmed) - 2)
              if (section == "input_devices") has_input_sec = 1
              if (section == "rendering") has_render_sec = 1
              print line
              next
            }

            if (section == "display" && line ~ /^window\/stretch\/mode=/) {
              if (seen_stretch_mode) next
              seen_stretch_mode = 1
            }

            if (section == "input_devices" && line ~ /^pointing\/emulate_mouse_from_touch=/) {
              has_mouse_from_touch = 1
            }

            if (section == "rendering" && line ~ /^textures\/vram_compression\/import_etc2_astc=/) {
              line = "textures/vram_compression/import_etc2_astc=true"
              has_etc2_astc = 1
            }

            print line
          }
          END {
            flush_section(section)
            if (!has_input_sec) {
              print ""
              print "[input_devices]"
              print ""
              print "pointing/emulate_touch_from_mouse=true"
              print "pointing/emulate_mouse_from_touch=true"
            }
            if (!has_render_sec) {
              print ""
              print "[rendering]"
              print ""
              print "renderer/rendering_method=\"mobile\""
              print "textures/canvas_textures/default_texture_filter=0"
              print "textures/vram_compression/import_etc2_astc=true"
            }
          }
          ' project.godot > project.godot.tmp && mv project.godot.tmp project.godot

      - name: Setup environment and templates
        run: |
          set -e
          SDK_DIR="${ANDROID_SDK_ROOT}"
          KEYSTORE_PATH="/root/.android/debug.keystore"
          TPL_ROOT="/root/.local/share/godot/export_templates/4.2.2.stable"
          TPL_GH="/github/home/.local/share/godot/export_templates/4.2.2.stable"

          mkdir -p /root/.android /github/home/.android "$SDK_DIR" /root/.config/godot /github/home/.config/godot "$TPL_ROOT" "$TPL_GH" build/android .godot/editor
          chmod -R 777 .godot

          if [ ! -f "$KEYSTORE_PATH" ]; then
            keytool -genkeypair -v -keystore "$KEYSTORE_PATH" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi
          cp "$KEYSTORE_PATH" /github/home/.android/debug.keystore

          if [ ! -f "$TPL_ROOT/android_debug.apk" ]; then
            wget -q -O /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz"
            unzip -q /tmp/templates.tpz -d /tmp/templates
            cp -r /tmp/templates/templates/* "$TPL_ROOT/"
          fi
          cp -r "$TPL_ROOT"/* "$TPL_GH/"

          yes | sdkmanager --sdk_root="$SDK_DIR" --licenses >/dev/null || true
          sdkmanager --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-33" "build-tools;33.0.2" >/dev/null

          JAVA_DIR="$(dirname "$(dirname "$(readlink -f "$(which javac)")")")"
          ADB_PATH="$SDK_DIR/platform-tools/adb"
          echo "Detected JAVA_DIR: $JAVA_DIR"

          for cfg_dir in /root/.config/godot /github/home/.config/godot; do
            for fname in editor_settings-4.tres editor_settings-4.editor_settings; do
              printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\nexport/android/adb = "%s"\nexport/android/debug_keystore = "%s"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\n' "$SDK_DIR" "$JAVA_DIR" "$ADB_PATH" "$KEYSTORE_PATH" > "$cfg_dir/$fname"
            done
          done

          cat <<EOF > export_presets.cfg
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/android/RimWorldColony.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/export_format=0
          gradle_build/min_sdk="24"
          gradle_build/target_sdk="33"
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name="1.0"
          package/unique_name="com.denys.rimworldcolony"
          package/name="RimWorld Colony"
          package/signed=true
          keystore/debug="$KEYSTORE_PATH"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          keystore/release=""
          keystore/release_user=""
          keystore/release_password=""
          screen/immersive_mode=true
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true
          EOF

      - name: Export Debug APK
        run: |
          set -e
          mkdir -p build/android .godot/editor
          godot --headless --import
          godot --headless --export-debug "Android" build/android/RimWorldColony.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RimWorldColony-Android-APK
          path: build/android/RimWorldColony.apk
          
