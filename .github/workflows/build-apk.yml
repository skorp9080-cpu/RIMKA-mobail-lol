name: Build Android APK (Godot 4)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  export-android:
    name: Export APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup environment and templates
        run: |
          set -e
          SDK_DIR="/usr/local/android-sdk"
          KEYSTORE_PATH="/root/.android/debug.keystore"
          TPL_ROOT="/root/.local/share/godot/export_templates/4.2.2.stable"
          TPL_GH="/github/home/.local/share/godot/export_templates/4.2.2.stable"

          mkdir -p /root/.android /github/home/.android "$SDK_DIR" /root/.config/godot /github/home/.config/godot "$TPL_ROOT" "$TPL_GH" build/android

          if [ ! -f "$KEYSTORE_PATH" ]; then
            keytool -genkeypair -v -keystore "$KEYSTORE_PATH" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi
          cp "$KEYSTORE_PATH" /github/home/.android/debug.keystore

          if [ ! -f "$TPL_ROOT/android_debug.apk" ]; then
            wget -q -O /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz"
            unzip -q /tmp/templates.tpz -d /tmp/templates
            cp -r /tmp/templates/templates/* "$TPL_ROOT/"
          fi
          cp -r "$TPL_ROOT"/* "$TPL_GH/"

          yes | sdkmanager --sdk_root="$SDK_DIR" --licenses >/dev/null || true
          sdkmanager --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-33" "build-tools;33.0.2" >/dev/null

          JAVA_BIN="$(readlink -f "$(which java)")"
          JAVA_DIR="$(dirname "$(dirname "$JAVA_BIN")")"

          HOME=/root godot --headless --quit || true
          HOME=/github/home godot --headless --quit || true

          python3 - "$SDK_DIR" "$JAVA_DIR" "$KEYSTORE_PATH" << 'PY'
          import sys, glob

          sdk, java_dir, ks = sys.argv[1:4]
          paths = glob.glob("/root/.config/godot/editor_settings-4*") + glob.glob("/github/home/.config/godot/editor_settings-4*")
          lines_to_set = {
              "export/android/android_sdk_path": f'"{sdk}"',
              "export/android/java_sdk_path": f'"{java_dir}"',
              "export/android/debug_keystore": f'"{ks}"',
              "export/android/debug_keystore_user": '"androiddebugkey"',
              "export/android/debug_keystore_pass": '"android"',
          }

          for p in set(paths):
              try:
                  with open(p, "r", encoding="utf-8") as f:
                      text = f.read()
              except Exception:
                  continue
              for k, v in lines_to_set.items():
                  prefix = k + " ="
                  new_line = f"{prefix} {v}"
                  if prefix in text:
                      out = []
                      for line in text.splitlines():
                          if line.startswith(prefix):
                              out.append(new_line)
                          else:
                              out.append(line)
                      text = "\n".join(out) + "\n"
                  else:
                      text = text.rstrip() + "\n" + new_line + "\n"
              with open(p, "w", encoding="utf-8") as f:
                  f.write(text)
          PY

      - name: Export Debug APK
        run: |
          mkdir -p build/android
          godot --headless --export-debug "Android" build/android/RimWorldColony.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RimWorldColony-Android-APK
          path: build/android/RimWorldColony.apk
          
