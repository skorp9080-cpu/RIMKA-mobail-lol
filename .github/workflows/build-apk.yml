name: Build Android APK (Godot 4)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  export-android:
    name: Export APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Android SDK, Java & Export Templates
        run: |
          set -e
          HOME_DIR="/github/home"
          SDK_DIR="/usr/local/android-sdk"
          TPL_DIR="$HOME_DIR/.local/share/godot/export_templates/4.2.2.stable"
          KEYSTORE_PATH="$HOME_DIR/.android/debug.keystore"

          mkdir -p "$HOME_DIR/.android" "$TPL_DIR" "$SDK_DIR" "$HOME_DIR/.config/godot" build/android

          if [ ! -f "$KEYSTORE_PATH" ]; then
            keytool -genkeypair -v -keystore "$KEYSTORE_PATH" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "$TPL_DIR/android_debug.apk" ]; then
            URL="https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz"
            wget -q -O /tmp/templates.tpz "$URL"
            unzip -q /tmp/templates.tpz -d /tmp/templates
            mv /tmp/templates/templates/* "$TPL_DIR/"
          fi

          yes | sdkmanager --sdk_root="$SDK_DIR" --licenses >/dev/null || true
          sdkmanager --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-33" "build-tools;33.0.2" >/dev/null

          JAVA_BIN_PATH="$(readlink -f "$(which java)")"
          JAVA_DIR="$(dirname "$(dirname "$JAVA_BIN_PATH")")"

          printf '[gd_editor_settings]\n\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\nexport/android/debug_keystore = "%s"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\n' "$SDK_DIR" "$JAVA_DIR" "$KEYSTORE_PATH" > "$HOME_DIR/.config/godot/editor_settings-4.editor_settings"
          cp "$HOME_DIR/.config/godot/editor_settings-4.editor_settings" "$HOME_DIR/.config/godot/editor_settings-4.tres"

          if [ -f "export_presets.cfg" ]; then
            grep -v '^keystore/debug=' export_presets.cfg | grep -v '^keystore/debug_user=' | grep -v '^keystore/debug_password=' > /tmp/export_presets.tmp
            printf 'keystore/debug="%s"\nkeystore/debug_user="androiddebugkey"\nkeystore/debug_password="android"\n' "$KEYSTORE_PATH" >> /tmp/export_presets.tmp
            mv /tmp/export_presets.tmp export_presets.cfg
          fi

          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_DIR" >> "$GITHUB_ENV"

      - name: Export Debug APK
        run: |
          godot --headless --verbose --export-debug "Android" build/android/RimWorldColony.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RimWorldColony-Android-APK
          path: build/android/RimWorldColony.apk
          
